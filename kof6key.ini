# KOF Key Mapper configuration
# Supported key names use System.Windows.Forms.Keys values, for example:
# Right, Left, F8, U, I, Oemcomma, NumPad0
# Lines starting with # or ; are comments.

# Combo delay configuration:
# ComboDelayBaseMs: Base fixed delay in milliseconds
# ComboDelayVarianceMs: Random variance added to base delay (0 to this value)
# Actual delay = ComboDelayBaseMs + random(0 to ComboDelayVarianceMs)
# Example: Base=25, Variance=5 means delay is 25-30ms
ComboDelayBaseMs=40
ComboDelayVarianceMs=5

# Global toggle hotkey for enabling or disabling mapping.
ToggleHotkey=Right