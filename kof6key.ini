# KOF Key Mapper configuration
# Supported key names use System.Windows.Forms.Keys values, for example:
# Right, Left, F8, U, I, Oemcomma, NumPad0
# Lines starting with # or ; are comments.

# Random delay range between A/S and D/S combo key presses.
# Example: 10 and 20 means the second key is sent after a random 10-20ms delay.
ComboDelayMinMs=10
ComboDelayMaxMs=30

# Global toggle hotkey for enabling or disabling mapping.
ToggleHotkey=Right

# Auto-fire configuration. Multiple keys can be separated by commas.
# Example: AutoFireKeys=U,I,O
# Supported separators: comma, pipe, or spaces.
# If multiple auto-fire keys are held at the same time, each key repeats independently.
# The first tap is sent immediately on key down.
# Repeating starts only after AutoFireHoldDelayMs has elapsed while the key is still held.
# Current repeat interval after auto-fire starts is fixed at 50ms per key.
AutoFireEnabled=true
AutoFireKeys=U
AutoFireHoldDelayMs=500
